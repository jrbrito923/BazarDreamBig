<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - BAZAR Dream Big</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-6">

    <!-- Modal de Autenticación Simple -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
            <h2 class="text-xl font-bold text-slate-800 mb-4 text-center">Acceso Administrador</h2>
            <input type="password" id="adminPass" placeholder="Contraseña de acceso" class="w-full px-4 py-2 border rounded-xl mb-4 text-sm outline-none focus:border-emerald-600">
            <button id="loginBtn" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-700 transition">Entrar</button>
        </div>
    </div>

    <!-- Panel de Control Principal -->
    <div id="adminPanel" class="max-w-4xl mx-auto hidden">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-black text-slate-900">Panel Admin - BAZAR Dream Big</h1>
            <a href="index.html" class="text-xs bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl hover:bg-slate-300">Ir a la Tienda (index.html)</a>
        </div>

        <!-- SECCIÓN 1: Gestión de Categorías -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-8">
            <h2 class="font-bold text-slate-800 text-lg mb-4">Gestión de Categorías</h2>
            <form id="categoryForm" onsubmit="saveCategory(event)" class="flex gap-3 mb-4">
                <input type="text" id="catName" placeholder="Nombre de categoría (ej. 🥖 Panadería)" required class="flex-1 px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                <button type="submit" id="catSubmitBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
                    + Agregar Categoría
                </button>
            </form>
            <div id="adminCategoryList" class="flex flex-wrap gap-2 pt-2 border-t">
                <p class="text-xs text-slate-400">Cargando categorías...</p>
            </div>
        </div>

        <!-- SECCIÓN 2: Formulario Agregar Producto -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-8">
            <h2 class="font-bold text-slate-800 text-lg mb-4">Agregar Nuevo Producto</h2>
            <form id="productForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Nombre del Producto *</label>
                        <input type="text" id="prodName" required class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Categoría *</label>
                        <select id="prodCategory" required class="w-full px-3 py-2 border rounded-xl text-sm">
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Precio *</label>
                        <input type="number" step="0.01" id="prodPrice" required class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Moneda *</label>
                        <select id="prodCurrency" class="w-full px-3 py-2 border rounded-xl text-sm">
                            <option value="CUP">CUP</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Etiqueta / Estado</label>
                        <select id="prodBadge" class="w-full px-3 py-2 border rounded-xl text-sm">
                            <option value="">Sin Etiqueta</option>
                            <option value="Oferta">Oferta</option>
                            <option value="Más Vendido">Más Vendido</option>
                            <option value="Frío Garantizado">Frío Garantizado</option>
                            <option value="Agotado">Agotado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Imagen del Producto *</label>
                        <input type="file" id="prodImageFile" accept="image/*" required onchange="previewImage(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                    </div>
                </div>

                <!-- Contenedor de Vista Previa de la Imagen -->
                <div id="imagePreviewContainer" class="hidden flex items-center gap-3 p-3 bg-slate-50 border rounded-xl">
                    <img id="imagePreview" src="" alt="Vista previa" class="w-16 h-16 rounded-lg object-cover border">
                    <div>
                        <p class="text-xs font-bold text-slate-700">Vista previa de la imagen</p>
                        <p id="imageInfo" class="text-[11px] text-slate-500"></p>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Descripción</label>
                    <textarea id="prodDescription" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow transition duration-200">
                    Guardar Producto en Supabase
                </button>
            </form>
        </div>

        <!-- SECCIÓN 3: Lista de Productos Existentes (Con Buscador) -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-4">
                <h2 class="font-bold text-slate-800 text-lg">Inventario Actual</h2>
                <input type="text" id="adminSearchInput" oninput="filterAdminProducts()" placeholder="Buscar en el inventario..." class="w-full sm:w-64 px-3 py-1.5 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div id="adminProductList" class="space-y-3">
                <p class="text-xs text-slate-400">Cargando productos...</p>
            </div>
        </div>
    </div>

    <!-- Modal de Edición de Producto -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Editar Producto</h3>
            
            <form id="editForm" onsubmit="saveEditedProduct(event)" class="space-y-4">
                <input type="hidden" id="editProdId">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Producto</label>
                    <input type="text" id="editProdName" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Precio</label>
                        <input type="number" step="0.01" id="editProdPrice" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Moneda</label>
                        <select id="editProdCurrency" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="CUP">CUP</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Categoría</label>
                    <select id="editProdCategory" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción</label>
                    <textarea id="editProdDescription" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs hover:bg-slate-200 transition">
                        Cancelar
                    </button>
                    <button type="submit" id="saveEditBtn" class="flex-1 py-2 bg-emerald-600 text-white rounded-xl font-bold text-xs hover:bg-emerald-700 transition">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://omvgderozucdkctjivgx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DZGpJPCufNaB7PBCRwZtpg_4op3Srsx";
        const ADMIN_PASSWORD = "1234";

        window.spClient = null;
        let categoriesCache = [];
        let allAdminProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    window.spClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else {
                    console.error("No se encontró la librería de Supabase.");
                }
            } catch (e) {
                console.error("Error inicializando Supabase:", e.message);
            }

            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) loginBtn.addEventListener('click', checkPass);

            const productForm = document.getElementById('productForm');
            if (productForm) productForm.addEventListener('submit', saveProduct);
        });

        function checkPass() {
            const passInput = document.getElementById('adminPass');
            const pass = passInput ? passInput.value : '';
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadCategories();
                loadAdminProducts();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        // --- LÓGICA DE CATEGORÍAS ---
        async function loadCategories() {
            if (!window.spClient) return;
            const { data, error } = await window.spClient.from('categories').select('*');
            
            if (error) {
                console.error("Error cargando categorías:", error.message);
                return;
            }

            categoriesCache = data || [];
            renderCategoryOptions();
            renderCategoryChips();
        }

        function renderCategoryOptions() {
            const selects = [document.getElementById('prodCategory'), document.getElementById('editProdCategory')];
            const optionsHTML = categoriesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            
            selects.forEach(select => {
                if (select) select.innerHTML = optionsHTML;
            });
        }

        function renderCategoryChips() {
            const list = document.getElementById('adminCategoryList');
            if (!list) return;

            if (categoriesCache.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400">No hay categorías registradas.</p>`;
                return;
            }

            list.innerHTML = categoriesCache.map(c => `
                <div class="flex items-center gap-2 bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200">
                    <span>${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-slate-400 hover:text-red-500 font-bold ml-1">✕</button>
                </div>
            `).join('');
        }

        async function saveCategory(e) {
            e.preventDefault();
            if (!window.spClient) return;

            const nameInput = document.getElementById('catName');
            const name = nameInput.value.trim();
            if (!name) return;

            const id = name.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, '');

            const btn = document.getElementById('catSubmitBtn');
            btn.disabled = true;

            try {
                const { error } = await window.spClient.from('categories').insert([{ id, name }]);
                if (error) throw error;

                nameInput.value = '';
                await loadCategories();
            } catch (err) {
                alert("Error al guardar categoría: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteCategory(id) {
            if (!window.spClient) return;
            if (confirm(`¿Seguro que deseas eliminar esta categoría?`)) {
                const { error } = await window.spClient.from('categories').delete().eq('id', id);
                if (error) {
                    alert("Error al eliminar: " + error.message);
                } else {
                    loadCategories();
                }
            }
        }

        // --- VISTA PREVIA DE IMAGEN ---
        function previewImage(event) {
            const file = event.target.files[0];
            const container = document.getElementById('imagePreviewContainer');
            const preview = document.getElementById('imagePreview');
            const info = document.getElementById('imageInfo');

            if (file) {
                preview.src = URL.createObjectURL(file);
                info.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        // --- COMPRESIÓN DE IMÁGENES ---
        async function compressImage(file, maxWidth = 1000, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (!blob) {
                                reject(new Error('Fallo la compresión de la imagen.'));
                                return;
                            }
                            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // --- LÓGICA DE PRODUCTOS ---
        async function saveProduct(e) {
            e.preventDefault();
            if (!window.spClient) {
                alert("Error de conexión con Supabase.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Optimizando y subiendo imagen...";

            try {
                const fileInput = document.getElementById('prodImageFile');
                const file = fileInput.files[0];
                if (!file) throw new Error("Debes seleccionar una imagen.");

                const compressedFile = await compressImage(file, 1000, 0.75);

                const extension = 'jpg';
                const cleanBaseName = file.name
                    .split('.')[0]
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-zA-Z0-9_-]/g, "_");

                const fileName = `${Date.now()}_${cleanBaseName}.${extension}`;

                const { data: imgData, error: imgError } = await window.spClient.storage
                    .from('productos')
                    .upload(fileName, compressedFile, { cacheControl: '3600', upsert: true });

                if (imgError) throw imgError;

                const { data: urlData } = window.spClient.storage
                    .from('productos')
                    .getPublicUrl(fileName);

                const imageUrl = urlData.publicUrl;

                const badge = document.getElementById('prodBadge').value;
                let badgeColor = 'bg-emerald-600';
                if (badge === 'Agotado') badgeColor = 'bg-red-500';
                if (badge === 'Más Vendido') badgeColor = 'bg-amber-500';
                if (badge === 'Frío Garantizado') badgeColor = 'bg-purple-500';

                const newProd = {
                    name: document.getElementById('prodName').value.trim(),
                    category: document.getElementById('prodCategory').value,
                    price: parseFloat(document.getElementById('prodPrice').value),
                    currency: document.getElementById('prodCurrency').value,
                    badge: badge || null,
                    badge_color: badge ? badgeColor : null,
                    image: imageUrl,
                    description: document.getElementById('prodDescription').value.trim()
                };

                const { error: dbError } = await window.spClient
                    .from('products')
                    .insert([newProd]);

                if (dbError) throw dbError;

                alert("¡Producto agregado exitosamente con imagen optimizada!");
                document.getElementById('productForm').reset();
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                loadAdminProducts();

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Producto en Supabase";
            }
        }

        async function loadAdminProducts() {
            if (!window.spClient) return;
            const { data, error } = await window.spClient
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error cargando inventario:", error.message);
                return;
            }

            allAdminProducts = data || [];
            renderAdminProductsList(allAdminProducts);
        }

        function renderAdminProductsList(productsArray) {
            const list = document.getElementById('adminProductList');
            if (!list) return;

            if (productsArray.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400">No se encontraron productos.</p>`;
                return;
            }

            list.innerHTML = productsArray.map(p => `
                <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover" onerror="this.src='https://via.placeholder.com/50'">
                        <div>
                            <h4 class="font-bold text-xs text-slate-800">${p.name}</h4>
                            <p class="text-[11px] text-slate-500">$${p.price} ${p.currency || 'CUP'} | ${p.badge || 'Sin etiqueta'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="openEditModal(${p.id}, '${escapeQuotes(p.name)}', ${p.price}, '${p.currency || 'CUP'}', '${p.category}', '${escapeQuotes(p.description || '')}')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 transition">
                            Editar
                        </button>
                        <button onclick="toggleAgotado(${p.id}, '${p.badge || ''}')" class="text-xs px-2.5 py-1 rounded-lg font-bold ${p.badge === 'Agotado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${p.badge === 'Agotado' ? 'Reactivar' : 'Marcar Agotado'}
                        </button>
                        <button onclick="deleteProduct(${p.id}, '${p.image}')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-red-100 text-red-600 hover:bg-red-200">
                            Eliminar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterAdminProducts() {
            const query = document.getElementById('adminSearchInput').value.toLowerCase().trim();
            if (!query) {
                renderAdminProductsList(allAdminProducts);
                return;
            }

            const filtered = allAdminProducts.filter(p => p.name.toLowerCase().includes(query));
            renderAdminProductsList(filtered);
        }

        function escapeQuotes(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
        }

        async function deleteProduct(id, imageUrl) {
            if (!window.spClient) return;
            if (confirm("¿Seguro que deseas eliminar este producto y su imagen del servidor?")) {
                try {
                    if (imageUrl && imageUrl.includes('/productos/')) {
                        const fileName = imageUrl.split('/productos/').pop();
                        await window.spClient.storage.from('productos').remove([fileName]);
                    }

                    const { error } = await window.spClient.from('products').delete().eq('id', id);
                    if (error) throw error;

                    loadAdminProducts();
                } catch (err) {
                    alert("Error al eliminar el producto: " + err.message);
                }
            }
        }

        function openEditModal(id, name, price, currency, category, description) {
            document.getElementById('editProdId').value = id;
            document.getElementById('editProdName').value = name;
            document.getElementById('editProdPrice').value = price;
            document.getElementById('editProdCurrency').value = currency;
            document.getElementById('editProdCategory').value = category;
            document.getElementById('editProdDescription').value = description || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEditedProduct(e) {
            e.preventDefault();
            if (!window.spClient) return;

            const btn = document.getElementById('saveEditBtn');
            btn.disabled = true;
            btn.innerText = "Guardando...";

            const id = document.getElementById('editProdId').value;
            const updatedData = {
                name: document.getElementById('editProdName').value.trim(),
                price: parseFloat(document.getElementById('editProdPrice').value),
                currency: document.getElementById('editProdCurrency').value,
                category: document.getElementById('editProdCategory').value,
                description: document.getElementById('editProdDescription').value.trim()
            };

            try {
                const { error } = await window.spClient
                    .from('products')
                    .update(updatedData)
                    .eq('id', id);

                if (error) throw error;

                alert("¡Producto actualizado correctamente!");
                closeEditModal();
                loadAdminProducts();

            } catch (err) {
                alert("Error al actualizar: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Cambios";
            }
        }

        async function toggleAgotado(id, currentBadge) {
            if (!window.spClient) return;
            const newBadge = currentBadge === 'Agotado' ? null : 'Agotado';
            const newColor = newBadge === 'Agotado' ? 'bg-red-500' : null;

            await window.spClient.from('products').update({ badge: newBadge, badge_color: newColor }).eq('id', id);
            loadAdminProducts();
        }
    </script>
</body>
</html>
